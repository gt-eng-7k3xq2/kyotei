<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GARON稼働状況">
<meta name="theme-color" content="#070d18">
<title>GARON 稼働状況</title>
<style>
  :root{--bg:#070d18;--panel:#0d1726;--panel2:#132238;--line:#1f3a5c;--cy:#3ee0ff;--cy2:#8ff0ff;--vi:#8b7bff;--ok:#3ee0a0;--warn:#ffc857;--err:#ff5d73;--tx:#e6f1ff;--mu:#7f9bbd;--font:-apple-system,'Hiragino Sans','Segoe UI',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:radial-gradient(900px 400px at 80% -10%,#13284a 0,transparent 60%),var(--bg);color:var(--tx);font-family:var(--font);min-height:100vh;padding-bottom:40px;}
  .header{background:rgba(7,13,24,.92);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;backdrop-filter:blur(6px);}
  .ht{font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--cy);}
  .hs{font-size:11px;color:var(--mu);margin-top:2px;}
  .rb{background:var(--panel2);border:1px solid var(--line);color:var(--cy2);font-size:11px;padding:6px 12px;border-radius:6px;-webkit-appearance:none;}
  .wrap{max-width:680px;margin:0 auto;padding:12px 16px;}
  .card{background:linear-gradient(180deg,var(--panel),#0a1320);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .ct{font-size:11px;color:var(--cy);font-weight:800;margin-bottom:10px;letter-spacing:.14em;}
  .hero{display:flex;align-items:center;gap:12px;}
  .dot{width:16px;height:16px;border-radius:50%;flex:none;}
  .dot.ok{background:var(--ok);box-shadow:0 0 14px var(--ok);} .dot.warn{background:var(--warn);box-shadow:0 0 14px var(--warn);} .dot.error{background:var(--err);box-shadow:0 0 14px var(--err);}
  .hero b{font-size:16px;} .hero small{display:block;color:var(--mu);font-size:11px;margin-top:2px;}
  .al{border-radius:8px;padding:9px 11px;margin-top:8px;font-size:12px;line-height:1.5;border:1px solid;}
  .al.error{background:#3a1520;border-color:var(--err);color:#ffc0c9;} .al.warn{background:#382d10;border-color:var(--warn);color:#ffe3a0;} .al.info{background:#102a3a;border-color:var(--cy);color:var(--cy2);}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;} .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .st{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center;}
  .sv{font-size:19px;font-weight:800;color:var(--cy2);font-variant-numeric:tabular-nums;} .sl{font-size:10px;color:var(--mu);margin-top:3px;}
  .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);} .row:last-child{border-bottom:none;}
  .row .k{color:var(--mu);} .row .v{font-weight:700;text-align:right;}
  table{width:100%;border-collapse:collapse;} th{font-size:10px;color:var(--mu);padding:5px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;} th:first-child,td:first-child{text-align:left;}
  td{font-size:12px;padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;} tr:last-child td{border-bottom:none;}
  .up{color:var(--ok);} .dn{color:var(--err);} .mu{color:var(--mu);}
  .bd{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:9px;border:1px solid var(--line);}
  .bd.ok{color:var(--ok);border-color:var(--ok);} .bd.err{color:var(--err);border-color:var(--err);} .bd.off{color:var(--mu);} .bd.warn{color:var(--warn);border-color:var(--warn);}
  .note{font-size:10px;color:var(--mu);line-height:1.6;margin-top:8px;}
  .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px;position:relative;} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--cy));}
  .empty{color:var(--mu);font-size:12px;text-align:center;padding:14px 0;}
</style>
</head>
<body>
<div class="header"><div><div class="ht">GARON // STATUS</div><div class="hs" id="last">読み込み中...</div></div><button class="rb" onclick="load()">更新</button></div>
<div class="wrap" id="app"><div class="empty">読み込み中...</div></div>
<script>
const GIST_OWNER='gt-eng-7k3xq2', GIST_ID='c95fa9b66b4fb95d42d766a3e140cb0a', REFRESH_MS=60000, STALE_MIN=15;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(v,d=1)=>v==null?'—':(v*100).toFixed(d)+'%';
const fmt=iso=>{try{return new Date(iso).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',hour12:false});}catch(e){return iso||'不明';}};
const agoMin=iso=>iso?Math.round((Date.now()-new Date(iso).getTime())/60000):null;
// 2026-09-24変更(非公開化): 公開Gistではなく、PC(RaceOps)からTailscale経由で取得する。Tailscaleに接続していないと表示されない。
const STATUS_URL='https://yuta-1.taile1e601.ts.net/api/status';
async function getFile(name){const r=await fetch(STATUS_URL,{cache:'no-store'});if(!r.ok)throw new Error('PCから取得できません: HTTP '+r.status);return r.json();}
const stat=(v,l)=>`<div class="st"><div class="sv">${v}</div><div class="sl">${l}</div></div>`;
const row=(k,v)=>`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
const roiCls=v=>v==null?'mu':v>=1?'up':'dn';

function levelTable(byLevel){
  const names=['高','中上','中','低']; let h='<table><tr><th>確信度</th><th>件数</th><th>上位10点的中</th><th>検証時</th><th>回収(10点)</th></tr>';
  let any=false;
  for(const n of names){const b=byLevel&&byLevel[n]; if(!b||!b.n)continue; any=true;
    const diff=b.baseline&&b.hit10!=null?b.hit10-b.baseline.hit10:null;
    h+=`<tr><td>${n}</td><td>${b.n}</td><td class="${diff==null?'':diff>=-0.05?'up':'dn'}">${pct(b.hit10,0)}</td><td class="mu">${b.baseline?pct(b.baseline.hit10,0):'—'}</td><td class="${roiCls(b.roi10)}">${pct(b.roi10,0)}</td></tr>`;}
  return any?h+'</table>':'<div class="empty">まだ結果が確定したレースがありません</div>';
}
function dailyTable(daily){
  if(!daily||!daily.length)return '<div class="empty">日別の記録はまだありません</div>';
  let h='<table><tr><th>日付</th><th>件数</th><th>的中(10点)</th><th>回収(10点)</th><th>高:件</th><th>高:的中</th></tr>';
  for(const d of daily.slice(-10).reverse()){const a=d.all||{},b=d.high||{};h+=`<tr><td>${esc(d.date.slice(5))}</td><td>${a.n||0}</td><td>${pct(a.hit10,0)}</td><td class="${roiCls(a.roi10)}">${pct(a.roi10,0)}</td><td>${b.n||0}</td><td>${pct(b.hit10,0)}</td></tr>`;}
  return h+'</table>';
}
function calib(cal){
  if(!cal||!cal.length)return '';
  cal=cal.filter(c=>c.n>0); if(!cal.length)return '';
  return cal.map(c=>`<div style="margin-top:8px"><div class="row" style="border:0;padding:0"><span class="k">予測 ${esc(c.range)}(${c.n}レース)</span><span class="v">予測${pct(c.predicted,0)} ／ 実際${pct(c.actual,0)}</span></div><div class="bar"><i style="width:${Math.min(100,c.actual*100)}%"></i></div></div>`).join('');
}
// ---- 全レースの振り分け(ヒートマップ): 場ごとに1〜12Rを色のマスで並べる。マスを押すと詳細 ----
const VENUE_ORDER=['桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'];
const KSTYLE={
  notify:{c:'#3ee0a0',t:'通知',g:'◎'},skip_odds:{c:'#ffc857',t:'見送り(配当が薄い)',g:'△'},skip_conf:{c:'#5b7396',t:'見送り(確信度)',g:'－'},skip_other:{c:'#ffc857',t:'見送り',g:'△'},
  no_data:{c:'#ff5d73',t:'取得できず',g:'✕'},no_data_fixed:{c:'#8a4a5a',t:'取得できず(修正済みの不具合)',g:'✕'},no_feature:{c:'#ff5d73',t:'特徴不足',g:'✕'},error:{c:'#ff5d73',t:'エラー',g:'✕'},missed:{c:'#22344f',t:'評価なし',g:''},pending:{c:'#0d1726',t:'これから',g:'○'}
};
let pickedCell=null;let lastStatus=null;
function pickCell(v,r){pickedCell=v+'|'+r;if(lastStatus)renderDisp(lastStatus);}
function renderDisp(s){
  const el=document.getElementById('disp-card');if(!el)return;
  const d=s.dispositions||{counts:{},rows:[]};const c=d.counts||{};const n=k=>c[k]||0;const rows=d.rows;const total=rows.length;
  const skip=n('skip_conf')+n('skip_odds')+n('skip_other'),bad=n('no_data')+n('no_data_fixed')+n('no_feature')+n('error');
  const groups=[['notify','通知',n('notify')],['skip','見送り',skip],['bad','取れず',bad],['missed','評価なし',n('missed')],['pending','これから',n('pending')]];
  const gcolor={notify:'#3ee0a0',skip:'#5b7396',bad:'#ff5d73',missed:'#22344f',pending:'#1a2a44'};
  let h='<div class="ct">SORTING 今日の全レースの振り分け</div>';
  // 全体バー
  h+='<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:#0d1726;margin-bottom:10px">'+groups.map(g=>g[2]?'<div style="width:'+(g[2]/total*100)+'%;background:'+gcolor[g[0]]+'"></div>':'').join('')+'</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:14px">'+groups.map(g=>'<span style="font-size:12px"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:'+gcolor[g[0]]+';margin-right:5px"></i>'+g[1]+' <b style="font-size:15px">'+g[2]+'</b></span>').join('')+'<span class="mu" style="font-size:12px">全 <b>'+total+'</b></span></div>';
  // あなたの参入(GTOOL連携): 通知とどれだけ重なったか
  if(d.mine&&d.mine.total){const m=d.mine;h+='<div style="font-size:12px;margin:0 0 12px;padding:8px 10px;border:1px solid #ff8ad8;border-radius:8px"><b style="color:#ff8ad8">あなたの参入 '+m.total+'件</b>(的中 '+m.hit+'・外れ '+m.miss+(m.open?'・結果待ち '+m.open:'')+')<br><span class="mu">エンジン通知と重なり '+m.overlapNotify+'件／あなたのみ '+m.mineOnly+'件／エンジンのみ '+m.engineOnly+'件'+(d.wild&&d.wild.bets?'<br>うち WILD の購入 '+d.wild.bets+'件(紫の内枠)':'')+'</span></div>';}
  // ヒートマップ
  const by={};for(const r of rows){(by[r.venue]=by[r.venue]||{})[r.race]=r;}
  const venues=Object.keys(by).sort((a,b)=>{const i=VENUE_ORDER.indexOf(a),j=VENUE_ORDER.indexOf(b);return (i<0?99:i)-(j<0?99:j);});
  const cellSt='display:flex;align-items:center;justify-content:center;height:26px;border-radius:6px;font-size:11px;font-weight:800;color:#04121c;cursor:pointer;';
  h+='<div style="display:grid;grid-template-columns:44px repeat(12,1fr);gap:4px;align-items:center">';
  h+='<div></div>'+Array.from({length:12},(_,i)=>'<div class="mu" style="text-align:center;font-size:10px">'+(i+1)+'</div>').join('');
  for(const v of venues){
    h+='<div style="font-size:11px;font-weight:700;white-space:nowrap">'+esc(v)+'</div>';
    for(let r=1;r<=12;r++){
      const row=by[v][r];
      if(!row){h+='<div></div>';continue;}
      const st=KSTYLE[row.kind]||KSTYLE.missed;const sel=pickedCell===v+'|'+r;
      const isDark=(row.kind==='missed'||row.kind==='pending'||row.kind==='skip_conf');
      h+='<div onclick="pickCell(\''+v+'\','+r+')" style="'+cellSt+'background:'+st.c+';'+(isDark?'color:#9fb6d6;':'')+(row.kind==='pending'?'border:1px dashed #2a4a72;':'')+(row.kind==='notify'?'box-shadow:0 0 8px '+st.c+';':'')+(row.mine?'border:2px solid #ff8ad8;':'')+(row.wildBet?'box-shadow:inset 0 0 0 2px #a58bff;':'')+(sel?'outline:2px solid #fff;':'')+'position:relative;">'+st.g+(row.wild?'<i style="position:absolute;top:-4px;right:-3px;font-style:normal;font-size:9px;font-weight:800;color:#fff;background:'+(row.wild.tier==='strong'?'#7a4dff':'#5b7bd6')+';border-radius:6px;padding:0 4px;line-height:13px">W'+(row.wild.tier==='strong'?'強':'')+'</i>':'')+'</div>';
    }
  }
  h+='</div>';
  h+='<div class="mu" style="font-size:10px;margin:8px 0 12px">◎ 通知　<span style="color:#ff8ad8">ピンク枠 あなたの参入</span>　<span style="color:#a58bff">W/W強 WILDの参入の目安</span>　△ 見送り(配当が薄い)　－ 見送り(確信度)　✕ 取得できず(暗い赤は修正済みの不具合)　空白 評価なし　○ これから　／ マスを押すと詳細</div>';
  // 詳細
  let detail='<div class="mu" style="font-size:12px;text-align:center;padding:12px 0">マスを押すと、そのレースの振り分けと理由が出ます</div>';
  if(pickedCell){const [v,rr]=pickedCell.split('|');const row=(by[v]||{})[rr];if(row){const st=KSTYLE[row.kind]||KSTYLE.missed;
    detail='<div style="border-left:4px solid '+st.c+';background:var(--panel2);border-radius:8px;padding:10px 12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px">'+esc(v)+rr+'R</b><span class="mu" style="font-size:11px">'+(row.time?'締切 '+esc(row.time):'')+'</span></div><div style="font-size:14px;font-weight:800;color:'+st.c+';margin:4px 0">'+st.t+(row.level?'　<span class="mu" style="font-size:11px;font-weight:400">確信度 '+esc(row.level)+'</span>':'')+'</div><div style="font-size:12px;color:var(--tx);line-height:1.6">'+esc(row.reason)+'</div>'+(row.wild?'<div style="margin-top:8px;font-size:12px;color:#a58bff">WILD 参入の目安: '+(row.wild.tier==='strong'?'強':'候補')+'(状態: '+({new:'これから',notified:'通知済み',bet:'購入済み',pass:'見送り済み',closed:'締切済み'}[row.wild.state]||esc(row.wild.state))+')'+(row.wildBet?'　WILDで購入('+({hit:'的中',miss:'外れ',open:'結果待ち'}[row.wildBet]||'')+')':'')+'</div>':(row.wildBet?'<div style="margin-top:8px;font-size:12px;color:#a58bff">WILDで購入('+({hit:'的中',miss:'外れ',open:'結果待ち'}[row.wildBet]||'')+')</div>':''))+'</div>';}}
  h+=detail;
  // 通知したレース(いつでも見えるように)
  const nl=rows.filter(r=>r.kind==='notify');
  if(nl.length){h+='<div class="ct" style="margin-top:16px">通知したレース</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+nl.map(r=>'<span onclick="pickCell(\''+r.venue+'\','+r.race+')" style="cursor:pointer;background:rgba(62,224,160,.12);border:1px solid #3ee0a0;color:#3ee0a0;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700">'+esc(r.venue)+r.race+'R <span style="font-weight:400;color:var(--mu)">'+esc(r.time)+'</span></span>').join('')+'</div>';}
  el.innerHTML=h;
}
function taskTable(tasks){
  if(!tasks||!tasks.length)return '<div class="empty">タスク情報がありません</div>';
  let h='<table><tr><th>タスク</th><th>状態</th><th>前回</th></tr>';
  for(const t of tasks){const st=t.state||t.State; const bd=st==='Disabled'?'<span class="bd err">無効</span>':st==='Running'?'<span class="bd ok">実行中</span>':'<span class="bd off">待機</span>';
    const res=t.result!=null?t.result:t.LastTaskResult; const lr=t.lastRun||t.LastRunTime; const bad=res!=null&&res!==0&&res!==267009&&res!==267011&&res!==267008;
    h+=`<tr><td style="font-size:11px">${esc((t.name||t.Name).replace('GARON_',''))}</td><td>${bd}</td><td class="${bad?'dn':'mu'}" style="font-size:10px">${lr?esc(new Date(lr).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})):'—'}${bad?' ✕':''}</td></tr>`;}
  return h+'</table>';
}


const TIER_JP={strong:'強',a:'候補'};const STATE_JP={new:'これから',notified:'通知済み',bet:'記録済み(購入)',pass:'見送り済み',closed:'締切済み'};
function renderWild(w){
  if(!w)return '';
  const ok=w.indexAgeMin!=null&&w.indexAgeMin<5;
  const alive=!w.inHours?'(稼働時間外)':ok?'動いています':w.indexAgeMin==null?'カード未作成':`${w.indexAgeMin}分止まっています`;
  const L=w.ledger||{},c=w.cards||{},bt=c.byTier||{};
  let h=`<div class="card"><div class="ct">WILD 荒れ予想(対話型)</div>
    <div class="g3">${stat((bt.strong||0)+'/'+(bt.a||0),'目安 強/候補')}${stat(c.total||0,'作ったカード')}${stat(w.notifiedCount||0,'通知した')}</div>
    <div class="g3" style="margin-top:8px">${stat(L.todayBets||0,'購入の記録')}${stat(L.todayPasses||0,'見送り')}${stat(L.waitingResults||0,'結果待ち')}</div>
    ${row('裏方(カード作成・結果取得)',`<span class="${w.inHours&&!ok?'dn':'up'}">${esc(alive)}</span>${w.indexAt?`<span class="mu">(最終 ${esc(fmt(w.indexAt))})</span>`:''}`)}
    ${row('結果の取得',`確定 ${(w.results||{}).confirmed||0}件${(w.results||{}).manual?`(うち手入力 ${w.results.manual}件)`:''}`)}`;
  if((w.entryRaces||[]).length){
    h+='<div style="margin-top:10px"><table><tr><th>レース</th><th>締切</th><th>目安</th><th>状態</th></tr>'+
      w.entryRaces.map(r=>`<tr><td>${esc(r.venue)}${r.race}R</td><td>${esc(r.deadline)}</td><td>${esc(TIER_JP[r.tier]||'')}</td><td>${esc(STATE_JP[r.state]||r.state)}</td></tr>`).join('')+'</table></div>';
  } else h+='<div class="note" style="margin-top:8px">今日は、参入の目安が出たレースはまだありません。</div>';
  h+='</div>';
  return h;
}
function render(s){
  const e=s.engine||{}, t=s.today||{}, v=s.verification||{}, live=v.live, rep=v.replay;
  const label={ok:'正常に稼働中',warn:'注意があります',error:'対応が必要です'}[s.overall]||'—';
  const stale=agoMin(s.updatedAt); const staleBad=stale!=null&&stale>STALE_MIN;
  let h=`<div class="card"><div class="hero"><div class="dot ${staleBad?'error':esc(s.overall)}"></div><div><b>${staleBad?'更新が止まっています':label}</b><small>PCからの最終更新 ${esc(fmt(s.updatedAt))}(${stale}分前)</small></div></div>`;
  if(staleBad)h+=`<div class="al error">PCからの更新が${stale}分間ありません。PCの電源・ネットワーク・タスク GARON_EngineStatus を確認してください。</div>`;
  for(const a of s.alerts||[])h+=`<div class="al ${esc(a.level)}">${esc(a.text)}</div>`;
  h+='</div>';
  h+=`<div class="card"><div class="ct">TODAY 今日の動き(${esc(t.date||'')})</div><div class="g3">${stat(t.judgments||0,'予測したレース')}${stat(t.high||0,'確信度「高」')}${stat(t.notificationsSent||0,'通知送信')}</div>
    <div class="g3" style="margin-top:8px">${stat(t.mid_high||0,'中上')}${stat(t.collected||0,'データ取得成功')}${stat(t.collectionFailed||0,'取得失敗')}</div>
    ${t.lastEventAt?`<div class="note">最新の記録: ${esc(fmt(t.lastEventAt))}</div>`:''}</div>`;
  h+=`<div class="card"><div class="ct">ENGINE エンジンの状態</div>${row('エンジン',esc(e.name||'—'))}${row('予測に使う統計の日付',esc(e.stateDay||'—')+(e.stateLagDays!=null?`<span class="mu">(${e.stateLagDays}日前)</span>`:''))}${row('データバンクの最新日',esc(e.dbLastRaceDate||'—'))}${row('モデルの学習データ',esc(e.modelTrainedThrough||'—')+(e.modelRaces?`<span class="mu">(${Number(e.modelRaces).toLocaleString()}レース)</span>`:''))}${row('通知の方針',esc((s.notifications||{}).policy||'—'))}${row('通知',(s.notifications||{}).paused?'<span class="bd warn">一時停止中</span>':'<span class="bd ok">送信中</span>')}</div>`;
  h+=`<div class="card"><div class="ct">LIVE 実運用の答え合わせ</div>`;
  if(live&&live.totalConfirmed){h+=`<div class="g3">${stat(live.totalConfirmed,'結果確定')}${stat(live.pending||0,'結果待ち')}${stat(pct(live.all.hit10,0),'上位10点的中')}</div>${levelTable(live.byLevel)}<div class="note">「検証時」は過去8万レースでの実績です。実運用の数字がこれを大きく下回り続けたら異常のサインです。件数が少ないうちは(30レース未満)ぶれが大きく、参考程度です。</div>`;}
  else h+='<div class="empty">実運用の結果はまだ確定していません(締切後、順次反映されます)</div>';
  h+='</div>';
  if(live&&live.daily)h+=`<div class="card"><div class="ct">DAILY 日別(実運用)</div>${dailyTable(live.daily)}</div>`;
  if(live&&live.calibration&&live.calibration.length)h+=`<div class="card"><div class="ct">CALIBRATION 予測確率と実際</div>${calib(live.calibration)}</div>`;
  if(rep&&rep.totalConfirmed)h+=`<div class="card"><div class="ct">REPLAY 過去日の再現(参考)</div><div class="g3">${stat(rep.totalConfirmed,'レース')}${stat(pct(rep.all.hit10,0),'上位10点的中')}${stat(pct(rep.all.roi10,0),'回収(10点)')}</div>${levelTable(rep.byLevel)}<div class="note">過去日のデータを、その日時点の統計でエンジンに通し直した結果です(実運用ではありません)。</div></div>`;
  h+=renderWild(s.wild);
  h+='<div class="card" id="disp-card"></div>';
  h+=`<div class="card"><div class="ct">TASKS 自動処理</div>${taskTable(s.tasks)}</div>`;
  h+='<div class="note" style="text-align:center">回収率はどの買い方でも控除率(約25%)の壁があり、平均で75〜80%が上限の目安です。<br>このページは自動更新されます(60秒ごと)</div>';
  document.getElementById('app').innerHTML=h;
  lastStatus=s;renderDisp(s);
  document.getElementById('last').textContent='表示更新 '+fmt(new Date().toISOString());
}
async function load(){
  try{render(await getFile('garon_status_engine.json'));}
  catch(e){document.getElementById('app').innerHTML=`<div class="card"><div class="al error">状況データを取得できませんでした。<br>${esc(e.message)}<br>PC側の更新(GARON_EngineStatus)がまだ動いていない可能性があります。</div></div>`;}
}
load(); setInterval(load,REFRESH_MS);
</script>
</body>
</html>
