<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GARON 稼働状況</title>
<style>
  :root{--bg:#102a1c;--surface:#1a4228;--surface2:#225535;--border:#347a48;--gold:#c9a84c;--gold2:#f0d080;--red:#e05050;--blue:#4a9eff;--green:#4caf7d;--text:#eef5f0;--muted:#82cc96;--font:-apple-system,'Hiragino Sans',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding-bottom:40px;}
  .header{background:linear-gradient(135deg,#1f5030,#102a1c);border-bottom:1px solid var(--gold);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  .header-title{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.05em;}
  .header-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .refresh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:11px;padding:6px 10px;border-radius:6px;-webkit-appearance:none;}
  .wrap{max-width:640px;margin:0 auto;padding:12px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
  .card-title{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:10px;letter-spacing:.08em;}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;border:1px solid var(--border);}
  .badge-green{background:#1a3a1a;color:var(--green);border-color:var(--green);}
  .badge-red{background:#3a1a1a;color:var(--red);border-color:var(--red);}
  .badge-gold{background:#3a3212;color:var(--gold2);border-color:var(--gold);}
  .badge-muted{background:var(--surface2);color:var(--muted);border-color:var(--border);}
  .stale-warning{background:#3a1a1a;border:1px solid var(--red);color:var(--red);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;font-weight:700;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .stat-item{background:var(--surface2);border-radius:8px;padding:10px 12px;text-align:center;}
  .stat-val{font-size:18px;font-weight:700;color:var(--gold);}
  .stat-label{font-size:10px;color:var(--muted);margin-top:2px;}
  .info-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border);}
  .info-row:last-child{border-bottom:none;}
  .info-row .k{color:var(--muted);}
  .info-row .v{color:var(--text);font-weight:600;}
  table{width:100%;border-collapse:collapse;}
  th{font-size:10px;color:var(--muted);padding:5px 4px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{font-size:11px;padding:7px 4px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .empty-note{font-size:12px;color:var(--muted);text-align:center;padding:16px 0;}
  .footer-note{font-size:10px;color:var(--muted);text-align:center;line-height:1.6;margin-top:8px;}
  .loading{text-align:center;padding:40px 0;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-title">🚤 GARON 稼働状況</div>
    <div class="header-sub" id="lastFetched">読み込み中...</div>
  </div>
  <button class="refresh-btn" id="refreshBtn" onclick="loadAll()">更新</button>
</div>
<div class="wrap" id="app">
  <div class="loading">読み込み中...</div>
</div>

<script>
const GIST_ID = 'c95fa9b66b4fb95d42d766a3e140cb0a';
const REFRESH_MS = 120000; // GitHub APIの未認証レート制限(60回/時)に対し、手動更新ボタンの余地も残すため2分間隔(自動だけで30回/時)
const STALE_MINUTES = 12; // 稼働時間帯中にこれ以上更新が無ければ「止まっている疑い」表示

function fmtTime(iso) {
  if (!iso) return '不明';
  try {
    return new Date(iso).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false });
  } catch (e) { return iso; }
}

function minutesAgo(iso) {
  if (!iso) return null;
  const diff = Date.now() - new Date(iso).getTime();
  return Math.round(diff / 60000);
}

function isActiveHourJST() {
  const h = new Date().toLocaleString('en-US', { timeZone: 'Asia/Tokyo', hour: 'numeric', hour12: false });
  const hour = parseInt(h, 10);
  return hour >= 8 && hour < 22;
}

async function fetchGistFile(filename) {
  const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, { cache: 'no-store' });
  if (res.status === 403) throw new Error('GitHubの一時的なアクセス制限(1時間あたりの上限)に達しました。しばらく(最大1時間)待ってから更新ボタンを押してください。');
  if (!res.ok) throw new Error(`Gist取得失敗: HTTP ${res.status}`);
  const data = await res.json();
  const file = data.files && data.files[filename];
  if (!file) throw new Error(`ファイルが見つかりません: ${filename}`);
  let text = file.content;
  if (file.truncated) {
    const rawRes = await fetch(file.raw_url, { cache: 'no-store' });
    text = await rawRes.text();
  }
  return JSON.parse(text);
}

function judgeBadge(entered) {
  return entered
    ? '<span class="badge badge-gold">◎参戦</span>'
    : '<span class="badge badge-muted">見送り</span>';
}

function taskStateBadge(state) {
  if (state === 'Ready') return '<span class="badge badge-green">Ready</span>';
  if (state === 'Running') return '<span class="badge badge-gold">実行中</span>';
  if (state === 'Disabled') return '<span class="badge badge-red">無効化</span>';
  return `<span class="badge badge-muted">${state || '不明'}</span>`;
}

function taskResultBadge(code) {
  if (code === 0) return '<span class="badge badge-green">正常</span>';
  if (code === 267009) return '<span class="badge badge-gold">実行中</span>'; // SCHED_S_TASK_RUNNING
  if (code === 267011) return '<span class="badge badge-muted">未実行</span>'; // 一度も実行されていない
  return `<span class="badge badge-red">異常(${code})</span>`;
}

function renderScreening(data) {
  const stale = isActiveHourJST() && minutesAgo(data.updatedAt) !== null && minutesAgo(data.updatedAt) > STALE_MINUTES;
  const ds = data.dayStats || { evaluated: 0, entered: 0, failed: 0 };
  let html = '';
  if (stale) {
    html += `<div class="stale-warning">⚠️ 稼働時間帯中ですが${minutesAgo(data.updatedAt)}分間更新がありません。プロセスが止まっている可能性があります。</div>`;
  }
  html += `<div class="card">
    <div class="card-title">リアルタイムスクリーニング</div>
    <div class="info-row"><span class="k">データ更新</span><span class="v">${fmtTime(data.updatedAt)}</span></div>
    <div class="info-row"><span class="k">稼働時間帯</span><span class="v">${data.activeHourStart ?? '?'}時〜${(data.activeHourEnd ?? 22) - 1}時台</span></div>
    <div class="info-row"><span class="k">kyoteibiyori.com</span><span class="v">${data.siteBlocked ? '<span class="badge badge-red">アクセス制限中</span>' : '<span class="badge badge-green">到達可能</span>'}</span></div>
    <div class="info-row"><span class="k">判定エンジン</span><span class="v">v${data.engineVersion ?? '?'}(ROI≥${data.thresholds?.roiThreshold ?? '?'}, gap<${data.thresholds?.gapThreshold ?? '?'})</span></div>
    <div class="info-row"><span class="k">追跡中レース数</span><span class="v">${data.trackedRaces ?? '?'}件</span></div>
    <div class="grid3" style="margin-top:10px;">
      <div class="stat-item"><div class="stat-val">${ds.evaluated}</div><div class="stat-label">チェック件数</div></div>
      <div class="stat-item"><div class="stat-val">${ds.entered}</div><div class="stat-label">参戦</div></div>
      <div class="stat-item"><div class="stat-val">${ds.failed}</div><div class="stat-label">取得エラー</div></div>
    </div>
  </div>`;
  return html;
}

function renderJudgments(data) {
  const list = (data.judgments || []).slice().reverse(); // 新しい順
  let html = '<div class="card"><div class="card-title">本日の判定一覧(参戦・見送り全件)</div>';
  if (!list.length) {
    html += '<div class="empty-note">本日はまだ判定対象のレースがありません</div>';
  } else {
    html += `<div style="overflow-x:auto;"><table><thead><tr>
      <th>時刻</th><th>レース</th><th>判定</th><th>理由</th><th>的中率</th><th>ROI</th><th>gap</th>
    </tr></thead><tbody>`;
    for (const j of list) {
      html += `<tr>
        <td>${j.time || '?'}</td>
        <td>${j.venue || ''}${j.raceNo || ''}R</td>
        <td>${judgeBadge(j.entered)}</td>
        <td style="color:var(--muted);">${j.judgeText || ''}</td>
        <td>${j.estHit ?? '?'}%</td>
        <td>${j.estRoi ?? '?'}%</td>
        <td>${j.gap ?? '?'}</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
  }
  html += '</div>';
  return html;
}

function renderTasks(data) {
  const tasks = (data && data.tasks) || null;
  let html = '<div class="card"><div class="card-title">無人運用タスクの健全性</div>';
  if (!tasks) {
    html += '<div class="empty-note">タスク情報を取得できていません</div>';
  } else {
    html += `<div style="overflow-x:auto;"><table><thead><tr>
      <th>タスク</th><th>状態</th><th>最終実行</th><th>結果</th>
    </tr></thead><tbody>`;
    for (const t of tasks.slice().sort((a, b) => (a.Name || '').localeCompare(b.Name || ''))) {
      html += `<tr>
        <td>${(t.Name || '').replace('GARON_', '')}</td>
        <td>${taskStateBadge(t.State)}</td>
        <td>${t.LastRunTime ? fmtTime(t.LastRunTime) : '未実行'}</td>
        <td>${taskResultBadge(t.LastTaskResult)}</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
    html += `<div class="footer-note">最終取得: ${fmtTime(data.updatedAt)}(15分おきに更新)</div>`;
  }
  html += '</div>';
  return html;
}

async function loadAll() {
  const btn = document.getElementById('refreshBtn');
  btn.textContent = '更新中...';
  const app = document.getElementById('app');
  try {
    const [screening, tasks] = await Promise.all([
      fetchGistFile('garon_status_screening.json'),
      fetchGistFile('garon_status_tasks.json'),
    ]);
    app.innerHTML = renderScreening(screening) + renderJudgments(screening) + renderTasks(tasks);
    document.getElementById('lastFetched').textContent = `最終取得: ${new Date().toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false })}`;
  } catch (e) {
    app.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red);">読み込みエラー</div><div style="font-size:12px;color:var(--muted);">${e.message}</div></div>`;
  } finally {
    btn.textContent = '更新';
  }
}

loadAll();
setInterval(loadAll, REFRESH_MS);
</script>
</body>
</html>
